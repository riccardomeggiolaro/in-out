# Costruisce l'immagine Docker di in-out e la pubblica (privata) su GitHub Container Registry.
#
# - push su main       -> ghcr.io/<owner>/in-out:latest (+ :sha-xxxxxxx)
# - tag vX.Y.Z         -> ghcr.io/<owner>/in-out:X.Y.Z, :X.Y, :latest
#                         + release GitHub con lo zip di installazione (in-out-docker.zip)
# - avvio manuale      -> scheda Actions > "Docker image" > Run workflow
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # creazione della release sui tag
  packages: write   # push su ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pacchetto di installazione
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/in-out-docker/docker
          cp docker-compose.yml docker-compose.windows.yml .env.example \
             installer-docker.sh installer-docker.ps1 README.md dist/in-out-docker/
          cp docker/windows-usb-attach.ps1 dist/in-out-docker/docker/
          # Versione dell'immagine da installare
          sed -i "s/^IN_OUT_TAG=.*/IN_OUT_TAG=${GITHUB_REF_NAME#v}/" dist/in-out-docker/.env.example
          cd dist && zip -r in-out-docker.zip in-out-docker

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/in-out-docker.zip
          generate_release_notes: true
